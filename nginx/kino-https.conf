# Лимиты против абьюза. Токен в плагине публичен (плагин раздаётся с GitHub),
# поэтому защищает не секретность, а стоимость запроса: сколько запросов в
# секунду принимаем с одного IP и с какой скоростью отдаём видео.

limit_req_zone  $binary_remote_addr zone=kino_api:10m   rate=8r/s;
limit_req_zone  $binary_remote_addr zone=kino_media:10m rate=25r/s;
limit_req_zone  $binary_remote_addr zone=kino_cub:10m   rate=12r/s;
limit_conn_zone $binary_remote_addr zone=kino_conn:10m;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;

map $http_upgrade $cub_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name 94.156.237.213.nip.io;

    ssl_certificate     /etc/letsencrypt/live/94.156.237.213.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/94.156.237.213.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 128k;

    # отдельные журналы: в общем access.log 17 МБ сканерского шума с порта 80,
    # по этим двум файлам видно, кто именно пользуется сервисом
    access_log /var/log/nginx/kino-access.log;
    error_log  /var/log/nginx/kino-error.log warn;

    # точечные файлы и чужие пути не отдаём вообще
    location ~ /\. { return 404; }

    # --- видео-прокси: плейлисты и сегменты ---
    # Отдельный лимит: плеер тянет куски пачками, поэтому запросов больше,
    # зато на каждый ответ действует потолок скорости.
    location ~ ^/kino/[^/]+/(playlist\.m3u8|stream\.m3u8|index\.m3u8|segment\.ts|seg\.ts|segment\.m4s|hls|segment)$ {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

        limit_req  zone=kino_media burst=60 nodelay;
        limit_conn kino_conn 16;

        # первые 6 МБ отдаём на полной скорости (старт серии), дальше 8 МБ/с
        # на соединение — 720p идёт с запасом, канал не выжимается в ноль
        limit_rate_after 6m;
        limit_rate 8m;

        proxy_pass http://127.0.0.1:8791;
        include /etc/nginx/snippets/kino-proxy.conf;
    }

    # --- серверный экстрактор HDrezka/Kodik (JSON-ручки) ---
    location /kino/ {
        if ($request_method !~ ^(GET|POST|OPTIONS)$) { return 405; }

        limit_req  zone=kino_api burst=25 nodelay;
        limit_conn kino_conn 12;

        proxy_pass http://127.0.0.1:8791/kino/;
        include /etc/nginx/snippets/kino-proxy.conf;
    }

    # --- CUB для Lampa: /cub/... -> https://cub.best/... ---
    # Нужен, потому что cub.* не открывается из РФ: телевизор ходит на наш
    # HTTPS, а CUB запрашивает сервер.
    location /cub/ {
        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

        limit_req  zone=kino_cub burst=30 nodelay;
        limit_conn kino_conn 16;

        set $cors_origin $http_origin;
        if ($cors_origin = "") { set $cors_origin "*"; }

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass https://cub.best/;
        proxy_ssl_server_name on;
        proxy_ssl_name cub.best;
        proxy_set_header Host cub.best;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cub_connection_upgrade;
        proxy_read_timeout 120s;
        proxy_redirect off;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Expose-Headers "*" always;
    }

    # --- TMDB-прокси CUB: /cubtmdb/... -> https://tmdb.cub.best/... ---
    location /cubtmdb/ {
        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

        limit_req  zone=kino_cub burst=30 nodelay;
        limit_conn kino_conn 16;

        set $cors_origin $http_origin;
        if ($cors_origin = "") { set $cors_origin "*"; }

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass https://tmdb.cub.best/;
        proxy_ssl_server_name on;
        proxy_ssl_name tmdb.cub.best;
        proxy_set_header Host tmdb.cub.best;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_redirect off;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Expose-Headers "*" always;
    }
}
